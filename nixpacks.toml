[variables]
PHP_VERSION = "8.4"
COMPOSER_ALLOW_SUPERUSER = "1"

[phases.setup]
nixPkgs = [
  "php84",
  "php84Extensions.pdo_mysql",
  "php84Extensions.pdo",
  "php84Extensions.mbstring",
  "php84Extensions.xml",
  "php84Extensions.curl",
  "php84Extensions.tokenizer",
  "php84Extensions.fileinfo",
  "php84Extensions.openssl",
  "php84Extensions.gd",
  "php84Extensions.zip",
  "composer"
]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=CategorySeeder --force && php artisan serve --host=0.0.0.0 --port=$PORT"